<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nebula Bank — Dashboard (Demo)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
      body { background: linear-gradient(135deg, #0f172a, #1e1b4b); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 25px 60px rgba(0,0,0,.45); }
      .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
      .logo { display: flex; align-items: center; gap: 10px; }
      .logo-badge { width: 36px; height: 36px; border-radius: 10px; background: #4f46e5; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
      h1 { font-size: 20px; color: #0f172a; }
      .profile-info { text-align: right; }
      .welcome { font-size: 14px; font-weight: 600; color: #0f172a; }
      .account-card { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
      .balance-label { font-size: 13px; color: #64748b; font-weight: 600; margin-bottom: 4px; }
      .balance { font-size: 28px; font-weight: 700; color: #0f172a; margin-bottom: 16px; }
      .detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px; color: #334155; }
      .detail-label { color: #64748b; }
      .detail-value { font-weight: 600; font-family: monospace; font-size: 14px; }
      .contact-info { font-size: 13px; color: #475569; margin-bottom: 24px; display: flex; flex-direction: column; gap: 6px; }
      .contact-info strong { color: #0f172a; }
      .actions { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
      .btn-primary { display: block; text-align: center; width: 100%; background: #4f46e5; color: #fff; text-decoration: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; transition: background .15s; border: none; cursor: pointer; }
      .btn-primary:hover { background: #4338ca; }
      .btn-secondary { display: block; text-align: center; width: 100%; background: #f1f5f9; color: #0f172a; text-decoration: none; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 600; transition: background .15s; border: none; cursor: pointer; }
      .btn-secondary:hover { background: #e2e8f0; }
      .link { text-align: center; font-size: 13px; color: #4f46e5; text-decoration: none; font-weight: 600; display: block; }
      .link:hover { text-decoration: underline; }
      .seed { margin-top: 12px; width: 100%; background: #f1f5f9; color: #475569; border: 1px dashed #94a3b8; padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }
      .banner { margin-top: 18px; background: #fef9c3; border: 1px solid #fde047; color: #854d0e; border-radius: 10px; padding: 10px 14px; font-size: 11.5px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header-area">
        <div class="logo">
          <div class="logo-badge">N</div>
          <h1>Nebula Bank</h1>
        </div>
        <div class="profile-info">
          <div class="welcome">Welcome, <span id="user-name">******</span></div>
        </div>
      </div>

      <div class="account-card">
        <div class="balance-label">Available Balance</div>
        <div class="balance" id="balance">₹--,---.--</div>
        <div class="detail-row">
          <span class="detail-label">Account Number</span>
          <span class="detail-value" id="account-no">****-****-****</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">IFSC Code</span>
          <span class="detail-value" id="ifsc">----</span>
        </div>
      </div>

      <div class="contact-info">
        <div>Email: <strong id="email">-----</strong></div>
        <div>Phone: <strong id="phone">-----</strong></div>
      </div>

      <div class="actions">
        <a href="transfer.html" class="btn-primary">Transfer Money</a>
        <button class="btn-secondary">View Statement</button>
        <a href="#" class="link">Settings</a>
      </div>

      <button class="seed" id="seed" type="button">Fill demo data (fictional PII for testing redaction)</button>

      <div class="banner">
        This is a local demo page for the SIH prototype. All data is fictional and never leaves this
        page unless you interact with it.
      </div>
    </main>

    <script>
      document.getElementById("seed").addEventListener("click", () => {
        document.getElementById("user-name").textContent = "Satya Raman";
        document.getElementById("balance").textContent = "₹1,25,000.00";
        document.getElementById("account-no").textContent = "4532-8901-2345";
        document.getElementById("ifsc").textContent = "NEBU0001234";
        document.getElementById("email").textContent = "satya.demo@example.com";
        document.getElementById("phone").textContent = "+91 98765 43210";
      });
    </script>
  </body>
</html>
