<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Veil Demo — Video Call</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #101418; color: #e6edf3; margin: 0; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #8b949e; margin: 0 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 1000px; }
    .tile { border-radius: 14px; overflow: hidden; background: #1c2128; }
    .tile img { display: block; width: 100%; height: 320px; object-fit: cover; }
    .tile span { display: block; padding: 10px 12px; font-size: 14px; color: #c9d1d9; }
    button { margin-top: 22px; padding: 10px 18px; font-size: 15px; border-radius: 8px;
             border: 0; background: #238636; color: white; cursor: pointer; }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <h1>Team stand-up — live call</h1>
  <p class="sub">Three participants on camera. Faces should be detected by the on-device model.</p>
  <div class="grid">
    <div class="tile">
      <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Participant 1" />
      <span>Aarav — Product</span>
    </div>
    <div class="tile">
      <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Participant 2" />
      <span>Meera — Engineering</span>
    </div>
    <div class="tile">
      <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Participant 3" />
      <span>Dev — Design</span>
    </div>
  </div>
  <button id="leave">Leave call</button>
</body>
</html>
