<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nebula Bank — Online Banking (Demo)</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", system-ui, sans-serif; }
      body { background: linear-gradient(135deg, #0f172a, #1e1b4b); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
      .card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,.45); }
      .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
      .logo-badge { width: 36px; height: 36px; border-radius: 10px; background: #4f46e5; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; }
      h1 { font-size: 20px; color: #0f172a; }
      .sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
      label { display: block; font-size: 12px; font-weight: 600; color: #334155; margin: 14px 0 6px; }
      input { width: 100%; padding: 11px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .15s; }
      input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
      button[type=submit] { width: 100%; margin-top: 22px; background: #4f46e5; color: #fff; border: 0; padding: 13px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background .15s; }
      button[type=submit]:hover { background: #4338ca; }
      .seed { margin-top: 12px; width: 100%; background: #f1f5f9; color: #475569; border: 1px dashed #94a3b8; padding: 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }
      .banner { margin-top: 18px; background: #fef9c3; border: 1px solid #fde047; color: #854d0e; border-radius: 10px; padding: 10px 14px; font-size: 11.5px; line-height: 1.5; }
      #result { margin-top: 16px; text-align: center; font-weight: 600; min-height: 20px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">
        <div class="logo-badge">N</div>
        <h1>Nebula Bank</h1>
      </div>
      <p class="sub">Sign in to your online banking session</p>

      <form id="login-form">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />

        <button type="submit">Sign in</button>
      </form>

      <button class="seed" id="seed" type="button">Fill demo data (fictional PII for testing redaction)</button>

      <div class="banner">
        This is a local demo page for the SIH prototype. All data is fictional and never leaves this
        page unless you submit the form.
      </div>

      <p id="result"></p>
    </main>

    <script>
      document.getElementById("seed").addEventListener("click", () => {
        document.getElementById("email").value = "satya.demo@example.com";
        document.getElementById("password").value = "Str0ng!Passw0rd";
      });

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const ok = /.+@.+\..+/.test(email);
        const el = document.getElementById("result");
        el.textContent = ok ? "✓ Login accepted (demo)" : "✗ Invalid credentials format";
        el.style.color = ok ? "#059669" : "#dc2626";
      });
    </script>
  </body>
</html>
